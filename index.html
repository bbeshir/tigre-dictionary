<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Immediate HTML fallback refresh -->
    <meta http-equiv="refresh" content="0; url=https://beittigre.github.io/tigre-dictionary/">
    <!-- SEO canonical link instructing search engines of the permanent move -->
    <link rel="canonical" href="https://beittigre.github.io/tigre-dictionary/">
    <title>301 Moved Permanently</title>
    <script>
        (function() {
            var targetDomain = "https://beittigre.github.io/tigre-dictionary";
            
            // Extract path after /tigre-dictionary/ to preserve exact internal links
            var currentPath = window.location.pathname;
            var basePath = "/tigre-dictionary";
            var relativePath = "";

            if (currentPath.indexOf(basePath) === 0) {
                relativePath = currentPath.substring(basePath.length);
            } else {
                relativePath = currentPath;
            }

            // Construct full target URL including subpaths, search queries, and hash anchors
            var targetUrl = targetDomain + relativePath + window.location.search + window.location.hash;
            
            // Perform location replacement (behaves like a permanent 301 HTTP redirect)
            window.location.replace(targetUrl);
        })();
    </script>
</head>
<body>
    <p>This site has permanently moved to <a id="redirect-link" href="https://beittigre.github.io/tigre-dictionary/">https://beittigre.github.io/tigre-dictionary/</a>.</p>
    <script>
        // Update fallback link dynamically if JS is evaluated before redirection
        var targetDomain = "https://beittigre.github.io/tigre-dictionary";
        var basePath = "/tigre-dictionary";
        var relativePath = window.location.pathname.indexOf(basePath) === 0 ? window.location.pathname.substring(basePath.length) : window.location.pathname;
        var fullUrl = targetDomain + relativePath + window.location.search + window.location.hash;
        document.getElementById("redirect-link").href = fullUrl;
        document.getElementById("redirect-link").innerText = fullUrl;
    </script>
</body>
</html>
